# ── main ──────────────────────────────────────────────
shell /usr/bin/zsh
term xterm-256color

font_family      Kode Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

symbol_map U+E000-U+F8FF,U+2B60-U+2BFF CaskaydiaCove Nerd Font
symbol_map U+2600-U+26FF,U+2700-U+27BF,U+1F300-U+1F5FF,U+1F600-U+1F64F,U+1F680-U+1F6FF,U+1F900-U+1F9FF,U+1FA00-U+1FAFF JoyPixels

# pad=5x5
window_padding_width 5

# resize-delay-ms=100
resize_debounce_time 0.1 0.5

# initial-window-size-pixels=800x600
initial_window_width 800
initial_window_height 600

# word-delimiters=,│`|:"'()[]{}<>
select_by_word_characters ,│`|:"'()[]{}<>

# selection-target=clipboard
copy_on_select yes

# ── bell ──────────────────────────────────────────────
enable_audio_bell yes
visual_bell_duration 0.0
window_alert_on_bell no
bell_on_tab

# ── cursor ────────────────────────────────────────────
cursor_shape beam
cursor_unfocused_shape hollow
cursor_blink_interval 0.3
cursor_beam_thickness 1.0
cursor_underline_thickness 2.0

# ── colors ────────────────────────────────────────────
background_opacity 0.5
foreground #C1C1C1
background #000000
selection_foreground #b3b1ad
selection_background #073642
color0  #000000
color1  #5F8787
color2  #7799BB
color3  #556677
color4  #888888
color5  #999999
color6  #AAAAAA
color7  #C1C1C1
color8  #404040
color9  #5F8787
color10 #7799BB
color11 #556677
color12 #888888
color13 #999999
color14 #AAAAAA
color15 #C1C1C1
url_color #36a3d9
# osc8-underline=always
underline_hyperlinks always

# ── scrollback / mouse ────────────────────────────────
scrollback_lines 1000
# wheel_scroll_multiplier 3.0
# smooth scrolling (kitty >= 0.46): sub-line + inertial scroll for high
# precision devices (touchpad/touchscreen). Wayland only; on X11 and for
# low-precision wheel mice scrolling stays line-based.
pixel_scroll yes
momentum_scroll 0.96
# hide-when-typing=yes
mouse_hide_wait -1.0
# alternate-scroll-mode=yes is kitty's default.

# ── keybindings ───────────────────────────────────────
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map shift+insert paste_from_selection

map ctrl+shift+r show_scrollback

map ctrl+plus        change_font_size all +0.5
map ctrl+equal       change_font_size all +0.5
map ctrl+kp_add      change_font_size all +0.5
map ctrl+minus       change_font_size all -0.5
map ctrl+kp_subtract change_font_size all -0.5
map ctrl+0           change_font_size all 0
map ctrl+kp_0        change_font_size all 0

# spawn-terminal (OSC 7 carries cwd into the new window)
map ctrl+shift+n new_os_window_with_cwd

map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down

# show-urls-launch / show-urls-copy via the hints
map ctrl+shift+o kitten hints --type url
map ctrl+shift+y kitten hints --type url --action copy

# open the link under the mouse with ctrl+left click (kitty default is
# ctrl+shift+left). Discard the press when the program grabbed the mouse so
# only the release opens the URL.
mouse_map ctrl+left release ungrabbed,grabbed mouse_handle_click link
mouse_map ctrl+left press grabbed discard_event

map ctrl+shift+z previous_prompt
map ctrl+shift+x next_prompt
map ctrl+shift+u unicode_input

# url launch=xdg-open
open_url_with default

# ── sessions / remote control ─────────────────────────
# kitten @ needs this; used by kitty-sessionizer / kitty-worktrees.
allow_remote_control yes
# Per-instance control socket, so scripts outside kitty (e.g. Hyprland binds)
# can target a specific instance with `kitten @ --to unix:@kitty-<pid>`.
listen_on unix:@kitty-{kitty_pid}
# ctrl+space then s: browse all sessionizer/worktree sessions
map ctrl+space>s goto_session ~/.local/share/kitty/sessions
# ctrl+space then -: jump back to the previous session
map ctrl+space>- goto_session -1

# ── tmux workflow ─────────────────────────────────────
# Mirrors tmux.conf. One session file (and its OS window) per project, 
# one tmux window = one kitty tab, no splits.
# Prefix is ctrl+space, same as the tmux prefix (C-Space).
# New tabs join the active session and inherit its cwd, i.e. the equivalent of
# `tmux new-window -c "#{pane_current_path}"`.
# NOTE: kitty.conf only treats a line starting with # as a comment. There are
# no inline comments, so keep every comment on its own line.

# tmux prefix+c: new window in the current directory
map ctrl+shift+t new_tab_with_cwd
map ctrl+space>c new_tab_with_cwd
# tmux prefix+f: project sessionizer
map ctrl+space>f launch_tab /home/xaxeric/.config/kitty/kitty-sessionizer
# tmux prefix+N: previous window
map ctrl+space>N previous_tab
# tmux prefix+>: swap window right
map ctrl+space>. move_tab_forward
# tmux prefix+<: swap window left
map ctrl+space>, move_tab_backward
# tmux prefix+P: paste buffer
map ctrl+space>P paste_from_clipboard
# tmux prefix+r: reload config
map ctrl+space>r load_config_file
# tmux prefix+C-s: resurrect save
map ctrl+space>w save_as_session --relocatable --use-foreground-process --match=session:. .
# close the current window
map ctrl+space>x close_tab
# tmux `bind C-Space send-prefix`
map ctrl+space>space send_key ctrl+space
# tmux prefix+1..9: switch to window/tab N (1-based, like tmux base-index 1)
map ctrl+space>1 goto_tab 1
map ctrl+space>2 goto_tab 2
map ctrl+space>3 goto_tab 3
map ctrl+space>4 goto_tab 4
map ctrl+space>5 goto_tab 5
map ctrl+space>6 goto_tab 6
map ctrl+space>7 goto_tab 7
map ctrl+space>8 goto_tab 8
map ctrl+space>9 goto_tab 9
# Show only the active session's tabs in the tab bar (plus non-session tabs).
tab_bar_filter session:~ or session:^$
# Prefix the tab title with the session/project name.
tab_title_template {session_name} {title}
# ── closing ───────────────────────────────────────────
# Do not ask for confirmation when quitting or closing a tab/OS window, even
# while commands are still running. Default is -1 (ask when any window is busy).
confirm_os_window_close 0
