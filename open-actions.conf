# Click a directory listed by clicked-ls to cd the current shell.
#
# clicked-ls wraps each directory in an OSC 8 hyperlink using the custom `cd:`
# scheme and a percent-encoded absolute path. The path stays percent-encoded
# inside ${URL_PATH}, so the text typed by send_text is always shell-safe.
# clicked-ls-cd (a zsh function) decodes it and runs the builtin cd.
protocol cd
action send_text all clicked-ls-cd ${URL_PATH}\r
